<!-- index.html (PWA-оболочка v2.9.2) -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Складской Терминал Blum</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E25D1D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #F4F4F4;
      transition: background-color 0.2s ease;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbz9j2uVD6Mi_bvlbrUQ2u-I_Q4dUMFZjADVRThJqRkYO5MpQxHs8dv9oYrpjOQS1UQoQw/exec" scrolling="no"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker зарегистрирован!', reg))
          .catch(err => console.error('Ошибка Service Worker:', err));
      });
    }

    const savedTheme = localStorage.getItem('warehouse_theme_preference') || 'light';
    document.body.style.backgroundColor = savedTheme === 'dark' ? '#12100E' : '#F4F4F4';
    const metaThemeColor = document.querySelector('meta[name="theme-color"]');
    if (metaThemeColor) {
      metaThemeColor.setAttribute('content', savedTheme === 'dark' ? '#12100E' : '#E25D1D');
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.theme) {
        const theme = event.data.theme;
        localStorage.setItem('warehouse_theme_preference', theme);
        document.body.style.backgroundColor = theme === 'dark' ? '#12100E' : '#F4F4F4';
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', theme === 'dark' ? '#12100E' : '#E25D1D');
        }
      }
    });
  </script>
</body>
</html>
